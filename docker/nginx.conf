worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # mime.types に無いものだけを足す。
    # .wasm は 1.27 の mime.types に既にあるため、ここで再定義すると
    # duplicate extension で nginx が起動しない。
    types {
        text/javascript          mjs;
        application/octet-stream task tflite;
    }

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    # wasm は圧縮が効く（約12MB→3.4MB）。モデルは float16 済みなので圧縮しない。
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/wasm;

    # add_header は location に1つでもあると上位の指定を引き継がないため、
    # 必要な場所で同じ組を書き直している。
    map $host $sw_scope { default "/"; }

    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Service-Worker-Allowed $sw_scope always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # モデルとランタイムは中身が変わらないので長期キャッシュしてよい。
        # 存在しない場合は必ず 404 を返すこと。index.html を 200 で返すと、
        # アプリ側の「ローカル資産があるか」の判定(HEAD)が誤判定する。
        location /models/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /vendor/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Service-Worker-Allowed $sw_scope always;
        }

        # アプリ本体は毎回検証させる（オフライン用のキャッシュは Service Worker 側で持つ）
        location ~* \.(html|js|mjs|css)$ {
            add_header Cache-Control "no-cache" always;
            add_header Service-Worker-Allowed $sw_scope always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # クライアント側ルーティングは無いので、無い URL は 404 にする
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
